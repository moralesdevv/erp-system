# ============================================================
# Fail2Ban Filter - ERP API Brute Force Detection
# Detects repeated 401/403/429 responses to auth endpoints
# ============================================================

[Definition]

# Match repeated failed auth attempts (401/429) to /api/v1/auth
failregex = ^<HOST> .+ "(POST|GET) /api/v1/auth/(login|register|refresh).+" (401|429) .+$

ignoreregex =
