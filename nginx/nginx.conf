# ============================================================
# Nginx - ERP System Security Configuration
# Production-grade secure reverse proxy
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Hide server version ──────────────────────────────────
    server_tokens off;

    # ─── Log format ───────────────────────────────────────────
    log_format main_security
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for" '
        'rt=$request_time';

    access_log /var/log/nginx/access.log main_security;

    # ─── Performance ──────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ─── Compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/rss+xml
        application/atom+xml image/svg+xml;

    # ─── Buffer limits (prevent buffer overflow attacks) ──────
    client_body_buffer_size       16k;
    client_header_buffer_size     1k;
    client_max_body_size          20m;
    large_client_header_buffers   4 8k;
    client_body_timeout           30s;
    client_header_timeout         30s;
    send_timeout                  30s;

    # ─── Rate limiting zones ──────────────────────────────────
    # General API rate limit
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    # Strict limit for auth endpoints
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # Upload limit
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

    limit_req_status 429;

    # ─── Connection limiting ──────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── Real IP (Cloudflare) ─────────────────────────────────
    # Cloudflare IP ranges
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/conf.d/*.conf;
}
